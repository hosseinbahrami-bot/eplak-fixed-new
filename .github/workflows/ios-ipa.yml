# ============================================================================
#  ساخت اپ iOS — eplak-app-unsigned.ipa  (+ پروژه‌ی Xcode)
# ============================================================================
#  اپ iOS هم مثل اپ اندروید «خودِ وب‌اپ» را داخل خودش دارد و از روی file:// باز
#  می‌کند (ios-app/Eplak/Web ← با ios-app/sync-web.sh از ریشه‌ی مخزن ساخته می‌شود).
#  پس با هر تغییر در فایل‌های وب، IPA باید دوباره ساخته شود.
#
#  چرا «بدون امضا»؟ این ورک‌فلو هیچ حساب/کلید امضای اپل ندارد و نباید هم داشته
#  باشد (secret نمی‌خواهد). هر دو ساخت — شبیه‌ساز و دستگاه — با «امضای خاموش»
#  انجام می‌شود؛ نصب روی گوشی با Apple ID خودِ کاربر (Sideloadly / AltStore /
#  Xcode) انجام می‌شود — راهنما: docs/IOS_PWA_FA.md
#
#  ترتیب مراحل عمداً این است:
#    ساخت شبیه‌ساز ← آزمون دودی واقعی روی شبیه‌سار iPhone ← ساخت دستگاه
#    ← بسته‌بندی IPA ← «بازرسی IPA» ← انتشار
#  یعنی IPA فقط وقتی منتشر می‌شود که اپ واقعاً روی شبیه‌ساز اجرا شده باشد و
#  فایل‌های وبِ داخلش با مخزن یکی باشد.
#
#  دو رانر، یک بدنه (ios-build.yml):
#    ۱) ipa           → macos-latest (Apple Silicon، جدیدترین Xcode)
#    ۲) ipa-fallback  → macos-15-intel؛ فقط اگر اجرای اول «موفق» نشد — ازجمله وقتی
#       گیت‌هاب اصلاً رانر arm64 نداد («The job was not acquired by Runner of type
#       hosted even after multiple attempts»؛ ۱۴ اکتبر ۲۰۲۶ دو ساخت پیاپی همین‌طور
#       افتاد و IPA ریلیز کهنه ماند). اگر کل اجرا لغو شده باشد (push تازه‌تر)،
#       جایگزین هم اجرا نمی‌شود.
# ============================================================================

name: ساخت اپ iOS (IPA بدون امضا)

on:
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - 'index.html'
      - 'app.js'
      - 'manifest.json'
      - 'sw.js'
      - 'core/**'
      - 'modules/**'
      - 'views/**'
      - 'assets/**'
      - 'ios-app/**'
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write          # برای پیوست کردن IPA به ریلیز

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

# بدنه‌ی ساخت در .github/workflows/ios-build.yml است (workflow_call) تا یک بدنه
# روی دو رانر قابل اجرا باشد؛ env این‌جا به ورک‌فلوی صدازده‌شده نمی‌رسد، پس
# نام ریلیز به‌صورت ورودی (release_tag) داده می‌شود.
env:
  RELEASE_TAG: v2.0-eplak-update

jobs:
  ipa:
    name: ساخت IPA (رانر Apple Silicon)
    uses: ./.github/workflows/ios-build.yml
    with:
      runner: macos-latest
      release_tag: v2.0-eplak-update

  ipa-fallback:
    name: ساخت IPA (رانر Intel — فقط اگر اولی به نتیجه نرسید)
    needs: ipa
    # !cancelled(): اگر خودِ اجرا لغو شده (push تازه‌تر/دستی) دوباره تلاش نمی‌کند؛
    # result != success: شکست واقعی ساخت یا «رانر داده نشد» (job به‌صورت cancelled
    # ثبت می‌شود ولی اجرا لغو نشده) هر دو را می‌گیرد.
    if: ${{ !cancelled() && needs.ipa.result != 'success' }}
    uses: ./.github/workflows/ios-build.yml
    with:
      runner: macos-15-intel
      release_tag: v2.0-eplak-update
