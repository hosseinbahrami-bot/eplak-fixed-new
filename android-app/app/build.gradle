plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.example.eplakfixed'
    compileSdk 36
    buildToolsVersion"36.0.0"

    defaultConfig {
        /* نام بسته‌ی اپ = همان نامی که اپ اندروید در پروژه‌ی فایربیس (eplak-7e6ed) با آن ثبت شده
           (google-services.json → client[].android_client_info.package_name). پلاگین google-services
           فقط client هم‌نام را می‌پذیرد؛ وگرنه ساخت با «No matching client found» می‌ایستد.
           namespace (بسته‌ی کدِ کاتلین) عمداً com.example.eplakfixed مانده — اندروید اجازه می‌دهد
           applicationId با namespace فرق کند. ⚠️ تغییر applicationId یعنی «اپ دیگری»: نسخه‌ی قبلی
           (com.example.eplakfixed) باید حذف شود وگرنه دو آیکن می‌ماند. (نسخه‌ی ۲.۱) */
        applicationId 'com.eplak'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    /* کلید امضای «دیباگِ ثابت» (app/eplak-debug.keystore، داخل مخزن).
       پیش از این هر اجرای CI با کلید دیباگِ تازه‌ی همان ماشین امضا می‌کرد؛ در نتیجه
       اندروید نصب APK جدید روی نسخه‌ی قبلی را رد می‌کرد («برنامه نصب نشد») و کاربر
       مجبور بود اپ را حذف کند — که توکن فایربیس گوشی را هم باطل می‌کرد (NotRegistered).
       با کلید ثابت، APKهای بعدی روی هم به‌روزرسانی می‌شوند و توکن می‌ماند.
       (این کلید فقط برای دیباگ/تست است؛ برای فروشگاه کلید release جداگانه لازم است.) */
    signingConfigs {
        debug {
            storeFile file('eplak-debug.keystore')
            storePassword 'android'
            keyAlias 'eplakdebug'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def webAssetsDir = file("$buildDir/generated/webAssets")

tasks.register('syncWebAssets', Sync) {
    from('../../') {
        include 'index.html'
        include 'app.js'
        include 'core/**'
        include 'modules/**'
        include 'views/**'
        include 'assets/**'
    }
    into(webAssetsDir)
}

android.sourceSets.main.assets.srcDirs = [webAssetsDir]
tasks.named('preBuild').configure { dependsOn tasks.named('syncWebAssets') }

/* فایربیس (اعلان گوشی برای اپ اندروید).
   پلاگین google-services فقط وقتی اعمال می‌شود که فایل google-services.json
   در پوشه‌ی app باشد؛ پس اگر هنوز پروژه‌ی فایربیس ساخته نشده باشد،
   ساخت APK با خطا متوقف نمی‌شود (اعلان فایربیس فقط غیرفعال می‌ماند). */
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle('EplakFCM: google-services.json پیدا شد — اعلان فایربیس فعال می‌شود.')
} else {
    logger.lifecycle('EplakFCM: google-services.json نیست — اعلان فایربیس غیرفعال است (سایر امکانات سالم).')
}

dependencies {
    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.0'
    implementation 'androidx.room:room-ktx:2.6.0'
    kapt 'androidx.room:room-compiler:2.6.0'

    // Retrofit & OkHttp (همراه پشتیبانی از Redirect)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}