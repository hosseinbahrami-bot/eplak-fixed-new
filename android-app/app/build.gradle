plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

/* ── شماره‌ی نسخه ────────────────────────────────────────────────────────────
   پیش‌فرض همان 2.0 است؛ در CI (ورک‌فلوی android-apk.yml) با -PeplakVersionName و
   -PeplakVersionCode شماره‌ی یکتا داده می‌شود تا بفهمید کدام ساخت روی گوشی است
   (تنظیمات گوشی → برنامه‌ها → ای‌پلاک → آخرین نسخه). */
def appVersionCode = (project.findProperty('eplakVersionCode') ?: '2').toString().toInteger()
def appVersionName = (project.findProperty('eplakVersionName') ?: '2.0').toString()

/* ── کلید امضای release ──────────────────────────────────────────────────────
   کلید و رمزها در android-app/keystore.properties است (فایل کلید: eplak-release.p12).
   اگر کلید در مخزن نباشد (مثلاً روی دستگاهی که تازه clone کرده)، ساخت release بدون
   امضا انجام می‌شود و فقط APK «debug» قابل نصب است؛ در CI کلید بارِ اول ساخته و بعد
   در مخزن گذاشته می‌شود تا امضای همه‌ی نسخه‌ها یکی بماند. */
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def ksPath = ksProps.getProperty('storeFile')
def ksFile = ksPath ? rootProject.file(ksPath) : null
def ksReady = ksFile != null && ksFile.exists() && ksProps.getProperty('storePassword')
if (ksReady) {
    logger.lifecycle("EplakSign: کلید امضای release پیدا شد (${ksFile.name}) — APK امضاشده ساخته می‌شود.")
} else {
    logger.lifecycle('EplakSign: کلید امضا (android-app/eplak-release.p12) نیست — release بدون امضا ساخته می‌شود.')
}

android {
    namespace 'com.example.eplakfixed'
    compileSdk 36
    buildToolsVersion"36.0.0"

    defaultConfig {
        applicationId 'com.example.eplakfixed'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksReady) {
                storeFile ksFile
                storePassword ksProps.getProperty('storePassword')
                keyAlias ksProps.getProperty('keyAlias')
                keyPassword ksProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (ksReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def webAssetsDir = file("$buildDir/generated/webAssets")

tasks.register('syncWebAssets', Sync) {
    from('../../') {
        include 'index.html'
        include 'app.js'
        include 'core/**'
        include 'modules/**'
        include 'views/**'
        include 'assets/**'
    }
    into(webAssetsDir)
}

android.sourceSets.main.assets.srcDirs = [webAssetsDir]
tasks.named('preBuild').configure { dependsOn tasks.named('syncWebAssets') }

/* فایربیس (اعلان گوشی برای اپ اندروید).
   پلاگین google-services فقط وقتی اعمال می‌شود که فایل google-services.json
   در پوشه‌ی app باشد؛ پس اگر هنوز پروژه‌ی فایربیس ساخته نشده باشد،
   ساخت APK با خطا متوقف نمی‌شود (اعلان فایربیس فقط غیرفعال می‌ماند). */
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle('EplakFCM: google-services.json پیدا شد — اعلان فایربیس فعال می‌شود.')
} else {
    logger.lifecycle('EplakFCM: google-services.json نیست — اعلان فایربیس غیرفعال است (سایر امکانات سالم).')
}

dependencies {
    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.0'
    implementation 'androidx.room:room-ktx:2.6.0'
    kapt 'androidx.room:room-compiler:2.6.0'

    // Retrofit & OkHttp (همراه پشتیبانی از Redirect)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}