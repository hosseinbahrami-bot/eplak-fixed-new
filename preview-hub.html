<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرکز پیش‌نمایش ای‌پلاک | سامانه شهروندی و پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #14b8a6;
      --accent: #f59e0b;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Header Toolbar */
    header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #2dd4bf, #14b8a6, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    /* Switcher Tabs */
    .tab-group {
      display: flex;
      align-items: center;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.4);
    }
    /* Info & Quick Actions */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auth-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .auth-hint code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #fff;
    }
    .btn-quick-login {
      border: 1px solid rgba(45, 212, 191, 0.5);
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.3), rgba(20, 184, 166, 0.2));
      color: #2dd4bf;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-quick-login:hover {
      background: rgba(20, 184, 166, 0.3);
      color: #fff;
      border-color: #2dd4bf;
    }
    .btn-action {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: var(--text-muted);
    }
    /* Main Content Area */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      background: #090d16;
    }
    .view-pane {
      position: absolute;
      inset: 0;
      display: none !important;
      width: 100%;
      height: 100%;
    }
    .view-pane.active {
      display: flex !important;
    }

    /* Single App View (Mobile Mockup) */
    #pane-app {
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 80%);
    }
    .mobile-frame-wrap {
      position: relative;
      width: 390px;
      height: 100%;
      max-height: 844px;
      background: #000;
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mobile-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Single Admin View (Full Desktop) */
    #pane-admin {
      width: 100%;
      height: 100%;
    }
    #pane-admin iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f8fafc;
    }

    /* Side-by-Side Dual View */
    #pane-split {
      width: 100%;
      height: 100%;
      display: flex;
      gap: 16px;
      padding: 16px;
      background: #090d16;
    }
    .split-col-admin {
      flex: 1;
      min-width: 0;
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .split-col-admin .col-header {
      background: #0f172a;
      color: #fff;
      padding: 8px 14px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .split-col-admin iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
    .split-col-app {
      width: 390px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .split-col-app .col-header {
      width: 100%;
      background: #0f172a;
      color: #fff;
      padding: 8px 14px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .split-col-app .app-box {
      width: 100%;
      height: calc(100% - 35px);
      max-height: 800px;
      background: #000;
      border-radius: 0 0 24px 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .split-col-app iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 900px) {
      .auth-hint { display: none; }
      .brand-title span { display: none; }
      #pane-split { flex-direction: column; overflow-y: auto; }
      .split-col-app { width: 100%; height: 600px; }
      .split-col-admin { height: 600px; }
    }
  </style>
</head>
<body>
  <!-- Header Control Bar -->
  <header>
    <div class="brand-section">
      <div class="brand-logo-text">ای‌پلاک</div>
      <div class="brand-title">
        <span>سامانه مدیریت و خدمات شهری</span>
        <span class="brand-badge">پیش‌نمایش زنده</span>
      </div>
    </div>

    <!-- Navigation Switcher Tabs -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchView('app')">
        <i class="fas fa-mobile-alt"></i>
        <span>اپلیکیشن شهروندی</span>
      </button>
      <button class="tab-btn" onclick="switchView('admin')">
        <i class="fas fa-desktop"></i>
        <span>پنل مدیریت شهرداری</span>
      </button>
      <button class="tab-btn" onclick="switchView('split')">
        <i class="fas fa-columns"></i>
        <span>مشاهده همزمان (دوگانه)</span>
      </button>
    </div>

    <!-- Actions & Credentials Hint -->
    <div class="actions-group">
      <div class="auth-hint" title="اطلاعات ورود به ادمین">
        <i class="fas fa-key"></i>
        <span>مدیر:</span>
        <code>admin</code> / <code>admin123</code>
      </div>
      <button class="btn-quick-login" onclick="quickLoginAdmin()" title="ورود خودکار با حساب کاربری مدیر کل">
        <i class="fas fa-bolt"></i>
        <span>ورود سریع مدیر</span>
      </button>
      <a href="/" target="_blank" class="btn-action" title="باز کردن اپ شهروندی در تب جدید">
        <i class="fas fa-external-link-alt"></i>
        <span>اپ مستقیم</span>
      </a>
      <a href="/admin/login.php" target="_blank" class="btn-action" title="باز کردن پنل مدیریت در تب جدید">
        <i class="fas fa-external-link-alt"></i>
        <span>ادمین مستقیم</span>
      </a>
    </div>
  </header>

  <!-- Content Workspace -->
  <main>
    <!-- View 1: Citizen Mobile App -->
    <div id="pane-app" class="view-pane active">
      <div class="mobile-frame-wrap">
        <iframe id="iframe-app-single" src="/" title="اپلیکیشن شهروندی ای‌پلاک"></iframe>
      </div>
    </div>

    <!-- View 2: Municipality Admin Panel -->
    <div id="pane-admin" class="view-pane">
      <iframe id="iframe-admin-single" src="/admin/login.php" title="پنل مدیریت شهرداری ای‌پلاک"></iframe>
    </div>

    <!-- View 3: Side-by-Side Split View -->
    <div id="pane-split" class="view-pane">
      <!-- Left: Admin Desktop -->
      <div class="split-col-admin">
        <div class="col-header">
          <span><i class="fas fa-chart-line"></i> پنل مدیریت شهری (بک‌اند PHP + دیتابیس MariaDB)</span>
          <button class="btn-action" onclick="document.getElementById('iframe-admin-split').contentWindow.location.reload();" style="padding: 2px 8px;">
            <i class="fas fa-sync-alt"></i> تازه‌سازی
          </button>
        </div>
        <iframe id="iframe-admin-split" src="/admin/login.php" title="پنل مدیریت شهرداری ای‌پلاک"></iframe>
      </div>

      <!-- Right: Mobile Citizen App -->
      <div class="split-col-app">
        <div class="col-header">
          <span><i class="fas fa-mobile-screen"></i> اپلیکیشن موبایل شهروندی</span>
          <button class="btn-action" onclick="document.getElementById('iframe-app-split').contentWindow.location.reload();" style="padding: 2px 8px;">
            <i class="fas fa-sync-alt"></i> تازه‌سازی
          </button>
        </div>
        <div class="app-box">
          <iframe id="iframe-app-split" src="/" title="اپلیکیشن شهروندی ای‌پلاک"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script>
    function switchView(mode) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));

      if (mode === 'app') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('pane-app').classList.add('active');
      } else if (mode === 'admin') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('pane-admin').classList.add('active');
      } else if (mode === 'split') {
        document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
        document.getElementById('pane-split').classList.add('active');
      }
    }

    function quickLoginAdmin() {
      // Auto login in both admin frames
      const adminSingle = document.getElementById('iframe-admin-single');
      const adminSplit = document.getElementById('iframe-admin-split');
      if (adminSingle) adminSingle.src = '/admin/login.php';
      if (adminSplit) adminSplit.src = '/admin/login.php';
      switchView('admin');
    }
  </script>
</body>
</html>
