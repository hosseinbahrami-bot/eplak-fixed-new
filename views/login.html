<!-- ===== screen-otp.html ===== -->
  <div class="screen" id="screen-otp">
    <div class="bg-city">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>
    </div>
    <div style="background:var(--bg-screen); position:absolute; inset:0; z-index:2;"></div>

    <div class="top-header" style="position:relative;z-index:20;">
      <button class="notif-btn" onclick="showScreen('screen-login')">→</button>
      <div style="font-size:16px; font-weight:800;">تایید شماره موبایل</div>
      <div style="width:40px;"></div>
    </div>

    <div class="screen-content" style="position:relative;z-index:10; justify-content:center; gap:18px; padding:0 16px 30px;">
      <div style="text-align:center;">
        <div style="width:64px; height:64px; background:rgba(0,201,167,0.12); border:2px solid rgba(0,201,167,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px;">🔐</div>
        <h2 style="font-size:17px; font-weight:800;">کد تایید را وارد کنید</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-top:6px;">کد ۴ رقمی به شماره <span id="otpPhoneDisplay" style="color:var(--teal); direction:ltr; display:inline-block;">09120000000</span> پیامک شد</p>
      </div>

      <div class="login-card">
        <div class="otp-inputs-row">
          <input type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="1" class="otp-box" oninput="otpAutoNext(this)" onkeydown="otpKeyDown(this, event)" onpaste="otpPaste(event)">
          <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" oninput="otpAutoNext(this)" onkeydown="otpKeyDown(this, event)">
          <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" oninput="otpAutoNext(this)" onkeydown="otpKeyDown(this, event)">
          <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" oninput="otpAutoNext(this)" onkeydown="otpKeyDown(this, event)">
        </div>

        <div style="height:16px;"></div>
        <button class="btn-teal" onclick="verifyOtp()">
          <span>تایید و ورود</span>
        </button>

        <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--text-muted);">
          <span id="otpTimerText">ارسال مجدد کد تا ۰۰:۳۰</span>
          <a href="javascript:void(0)" id="otpResendLink" onclick="resendOtp()" style="color:var(--teal); font-weight:700; display:none;">ارسال مجدد کد</a>
        </div>
      </div>
    </div>
  </div>
